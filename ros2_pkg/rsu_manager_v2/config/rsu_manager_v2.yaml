rsu_manager_v2:
  ros__parameters:
    lut_file: ""
    target_poll_hz: 200.0
    state_poll_hz: 400.0
    command_rate_hz: 200.0
    target_timeout_ms: 100.0
    feedback_timeout_ms: 20.0
    feedback_actuator_margin_deg: 2.0
    left_motor_ids: [18, 20]
    right_motor_ids: [19, 21]
    initial_q: [0.0, -0.5672320]
    initial_alpha: [-0.458105, 0.458105]
    # 2x baseline on both virtual axes; roll gains use the same scale below.
    virtual_pitch_kp: 50.0
    virtual_pitch_kd: 2.4
    virtual_roll_scale: 1.37
    actuator_kp_min: [5.0, 5.0]
    # Fixed envelope for 1x..3x baseline (pitch Kp 25..75, Kd 1.2..3.6,
    # roll/pitch ratio 1.37). Dense LUT sweep: motor Kp <= 41.386, Kd <= 1.987.
    # Keep limits fixed while tuning within this range.
    actuator_kp_max: [45.0, 45.0]
    actuator_kd_min: [0.2, 0.2]
    # roa_main_controller requires kp < 50.0 and kd < 5.0.
    actuator_kd_max: [2.5, 2.5]
    default_kp: [9.0, 9.0]
    default_kd: [2.25, 2.25]
    publish_state_every_control_tick: true
